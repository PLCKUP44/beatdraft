<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeatDraft</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--c:#00E5FF;--g:#F5A623;--p:#7C3AED;--gr:#10B981;--r:#EF4444;
--bg:#060B14;--s:#0D1625;--s2:#111827;--b:rgba(255,255,255,.07);
--t:#CBD5E1;--m:#94A3B8;--pl:#C4B5FD}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--t);min-height:100vh;overflow-x:hidden}
.bb{font-family:'Bebas Neue',sans-serif;letter-spacing:.05em}
.mono{font-family:'JetBrains Mono',monospace}
/* TEXT COLORS - più visibili */
.muted{color:var(--m)}
.label{font-family:'Bebas Neue',sans-serif;letter-spacing:.16em;font-size:.64rem;color:var(--c);display:block;margin-bottom:4px}
/* CARDS */
.mcard{width:232px;height:368px;position:relative;border-radius:16px;overflow:hidden;cursor:pointer;
  transition:transform .35s cubic-bezier(.23,1,.32,1),box-shadow .35s;flex-shrink:0}
.mcard:hover{transform:translateY(-10px) rotate(-1.5deg)}
.cf{position:absolute;inset:0;border-radius:16px;padding:2.5px}
.cf-common{background:linear-gradient(145deg,#64748B,#334155,#64748B)}
.cf-rare{background:linear-gradient(145deg,#60A5FA,#1D4ED8,#60A5FA);box-shadow:0 0 22px rgba(59,130,246,.4)}
.cf-epic{background:linear-gradient(145deg,#C084FC,#7E22CE,#C084FC);box-shadow:0 0 30px rgba(168,85,247,.5)}
.cf-platinum{background:linear-gradient(145deg,#E8E0FF,#A78BFA,#E8E0FF,#C4B5FD);background-size:300% 300%;box-shadow:0 0 48px rgba(167,139,250,.8)}
.mcard:hover .cf-platinum{animation:plat 2s ease infinite}
@keyframes plat{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.ci{position:relative;width:100%;height:100%;background:linear-gradient(175deg,#131F35,#060B14);border-radius:13.5px;overflow:hidden}
.cbg{position:absolute;inset:0;background-image:repeating-linear-gradient(-45deg,transparent,transparent 12px,rgba(255,255,255,.015) 12px,rgba(255,255,255,.015) 24px)}
.holo{position:absolute;inset:0;opacity:0;background:linear-gradient(105deg,transparent 40%,rgba(196,181,253,.07) 45%,rgba(167,139,250,.06) 50%,transparent 60%);background-size:200% 200%;pointer-events:none;transition:opacity .3s}
.mcard:hover .holo{opacity:1;animation:holo 3s linear infinite}
@keyframes holo{0%{background-position:0% 0%}100%{background-position:200% 200%}}
.ca{width:100%;height:178px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.ca::after{content:'';position:absolute;bottom:0;left:0;right:0;height:55px;background:linear-gradient(to top,#060B14,transparent)}
.ctop{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.rpill{font-family:'Bebas Neue',sans-serif;letter-spacing:.07em;font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1)}
.cft{position:absolute;bottom:0;left:0;right:0;padding:10px 12px 12px;background:linear-gradient(to top,rgba(6,11,20,.99),rgba(6,11,20,.8));backdrop-filter:blur(12px)}
.sbar{height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;margin:5px 0}
.sfill{height:100%;background:linear-gradient(90deg,var(--c),#A855F7)}
/* BUTTONS */
.btn{font-family:'Bebas Neue',sans-serif;letter-spacing:.07em;border:none;cursor:pointer;border-radius:9px;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-p{background:var(--p);color:#fff;padding:8px 18px;font-size:.8rem}.btn-p:hover{background:#6D28D9}
.btn-g{background:rgba(255,255,255,.06);color:var(--t);padding:8px 18px;font-size:.8rem;border:1px solid var(--b)}.btn-g:hover{background:rgba(255,255,255,.11)}
.btn-sm{padding:4px 10px;font-size:.7rem}
.btn-c{background:rgba(0,229,255,.12);color:var(--c);border:1px solid rgba(0,229,255,.25)}.btn-c:hover{background:rgba(0,229,255,.2)}
/* NAV */
.nb{font-family:'Bebas Neue',sans-serif;letter-spacing:.07em;font-size:.83rem;padding:0 15px;height:50px;transition:all .2s;border-bottom:2px solid transparent;color:var(--m);background:none;border-top:none;border-left:none;border-right:none;cursor:pointer;white-space:nowrap}
.nb:hover{color:var(--t)}.nb.act{color:var(--c);border-bottom-color:var(--c)}
/* CHIPS */
.chip{font-family:'Bebas Neue',sans-serif;letter-spacing:.06em;padding:5px 13px;border-radius:20px;font-size:.73rem;border:1px solid var(--b);cursor:pointer;transition:all .2s;background:rgba(255,255,255,.04);color:var(--m)}
.chip:hover{background:rgba(255,255,255,.09);color:var(--t)}.chip.act{background:var(--c);color:#060B14;border-color:var(--c)}
/* PANELS */
.panel{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:20px}
/* MODALS */
.modal{display:none;position:fixed;inset:0;background:rgba(6,11,20,.93);z-index:1000;overflow-y:auto;backdrop-filter:blur(10px)}
.modal.open{display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--s);border:1px solid rgba(255,255,255,.1);border-radius:20px;overflow:hidden;width:100%;animation:fup .3s ease}
/* DRAWERS */
.drawer{position:fixed;top:0;right:-440px;width:420px;height:100vh;background:#080F1E;border-left:1px solid var(--b);z-index:500;transition:right .3s cubic-bezier(.23,1,.32,1);overflow:hidden}
.drawer.open{right:0}
/* HOVER STATES - tutte le interazioni */
.hi:hover{background:#131F35!important}
.hi2:hover{background:rgba(255,255,255,.025)!important}
.hi3:hover{background:rgba(255,255,255,.06)!important}
.hi4:hover{background:rgba(255,255,255,.08)!important}
.hig:hover{background:rgba(16,185,129,.1)!important}
/* SCROLLBAR */
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
/* ANIMATIONS */
@keyframes fup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.fu{animation:fup .35s ease forwards}
.pa{animation:pulse 2s infinite}
/* TAGS */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600}
.tg{background:rgba(16,185,129,.14);color:#34D399;border:1px solid rgba(16,185,129,.25)}
.to{background:rgba(245,166,35,.14);color:#FCD34D;border:1px solid rgba(245,166,35,.25)}
.tr{background:rgba(239,68,68,.14);color:#F87171;border:1px solid rgba(239,68,68,.25)}
.tc{background:rgba(0,229,255,.1);color:var(--c);border:1px solid rgba(0,229,255,.2)}
.tp{background:rgba(124,58,237,.14);color:#C4B5FD;border:1px solid rgba(124,58,237,.25)}
.tm{background:rgba(255,255,255,.06);color:var(--m);border:1px solid var(--b)}
.tpl{background:rgba(196,181,253,.12);color:#E8E0FF;border:1px solid rgba(196,181,253,.3)}
/* COMP CARD */
.cc{background:var(--s);border:1px solid var(--b);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s}
.cc:hover{transform:translateY(-3px);box-shadow:0 10px 36px rgba(0,0,0,.4)}
/* SCORE ROW */
.sr{display:grid;grid-template-columns:170px 85px 85px 85px 1fr;gap:0;padding:7px 13px;border-top:1px solid rgba(255,255,255,.05);align-items:center;cursor:default}
.sr:hover{background:rgba(255,255,255,.025)}
/* STAT MINI */
.stat-mini{background:rgba(255,255,255,.05);border-radius:5px;padding:3px 5px;text-align:center}
.stat-mini .lbl{color:var(--m);font-size:7px;margin-bottom:1px}
.stat-mini .val{font-family:'Bebas Neue',sans-serif;font-size:.92rem}

@media (max-width: 768px) {
  .mcard{width:calc(50% - 6px)!important}
  [style*="grid-template-columns"]:not(.sr){grid-template-columns:1fr!important}
  body{padding:0!important}
  main{padding:16px 12px!important}
}
</style>
</head>

<script>
// ============================================
// API BACKEND INTEGRATION

const API_URL = 'https://beatdraft-api.onrender.com';
let API_CACHE = {artists: null, lastFetch: null};

async function fetchArtists() {
  if (API_CACHE.artists && Date.now() - API_CACHE.lastFetch < 300000) return API_CACHE.artists;
  try {
    const response = await fetch(`${API_URL}/api/artists?limit=50`);
    if (!response.ok) throw new Error('API Error');
    const data = await response.json();
    API_CACHE.artists = data.artists;
    API_CACHE.lastFetch = Date.now();
    return data.artists;
  } catch (error) {
    console.error('Failed to fetch artists:', error);
    return null;
  }
}

function convertAPIArtist(artist, index) {
  // Genera rarità basata su categoria
  let rarity = 'Common';
  if (artist.category === 'Leggendario') rarity = 'Platinum';
  else if (artist.category === 'Mondiale') rarity = 'Epic';
  else if (artist.category === 'Grande') rarity = 'Rare';
  else if (artist.category === 'Emergente') rarity = 'Rare';
  
  return {
    cardId: `api-${artist.id}`,
    name: artist.name,
    artist: artist.name,
    emoji: artist.emoji || '🎵',
    spotifyId: artist.spotify_id,
    list: artist.monthly_listeners || artist.current_listeners || 0,
    monthlyListeners: artist.monthly_listeners || artist.current_listeners || 0,
    role: artist.category || 'Sconosciuto',
    category: artist.category || 'Sconosciuto',
    isLegacy: artist.is_legacy || false,
    rarity: rarity,
    price: Math.floor((artist.monthly_listeners || 1000000) / 50000),
    score: Math.floor((artist.monthly_listeners || 1000000) / 5000000),
    wg: Math.random() * 15 + 5, // Mock growth
    chart: artist.chart_position_it || artist.chart_position_global || null,
    fol: artist.followers || 0,
    mint: Math.floor(Math.random() * 500) + 1,
    total: 1000
  };
}

async function loadRealData() {
  console.log('🔄 Loading real data from API...');
  try {
    const apiArtists = await fetchArtists();
    if (apiArtists && apiArtists.length > 0) {
      CARDS = apiArtists.map((a, i) => convertAPIArtist(a, i));
      BA = CARDS; // Aggiorna anche BA
      console.log(`✅ Loaded ${CARDS.length} artists from API`);
      if (S.page === 'market') render();
    }
  } catch (error) {
    console.error('❌ API load failed:', error);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => setTimeout(loadRealData, 200));
} else {
  setTimeout(loadRealData, 200);
}
// ============================================

function categorize(list){
  if(list>=50e6)return"Mondiale";
  if(list>=5e6)return"Grande";
  if(list>=1e6)return"Emergente";
  return"Sconosciuto";

};
var fmt = function(n){return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?Math.round(n/1e3)+"K":String(n);};
var rc  = function(r){return (RCFG[r]||{c:"#fff"}).c;};
var px  = function(n){return n.toLocaleString();};
var el  = function(id){return document.getElementById(id);};

];

function calcScore(a){
  if(a.legacy){
    var legacyPts=a.fol/1e6*1.5;
    var followerGrowth=a.wg*30;
    return Math.round((legacyPts+followerGrowth)*(1+RB.Leggendario.b/100));
  }
  var role=categorize(a.list);
  var gp=Math.round(a.wg*50);
  var cb=a.chart?Math.max(0,(101-a.chart)*2):0;
  var raw=gp+cb;
  return Math.round(raw*(1+RB[role].b/100));
}
BA.forEach(function(a){
  a.role=a.legacy?"Leggendario":categorize(a.list);
  a.score=calcScore(a);
});

var CARDS=[];var cid=1;
BA.forEach(function(a){
  Object.keys(RCFG).forEach(function(r){
    var cfg=RCFG[r];
    CARDS.push({id:a.id,name:a.name,role:a.role,e:a.e,list:a.list,fol:a.fol,wg:a.wg,
      chart:a.chart,gen:a.gen,p:a.p,desc:a.desc,score:a.score,
      cardId:cid++,rarity:r,price:Math.floor(a.p*cfg.m),
      mint:Math.floor(Math.random()*cfg.s)+1,supply:cfg.s,legacy:!!a.legacy});
  });
});

];
var CIT=[
  {pos:1,d:0,t:"Sesso e samba",a:"Tony Effe ft Anna",e:"🃏",s:"4.2M"},

function cardH(card,opts){
  opts=opts||{};

  var iC=S.cart.some(function(c){return c.cardId===card.cardId;});

  var c=CARDS.find(function(x){return x.cardId===id;});
  if(!c)return;
  if(S.cart.some(function(x){return x.cardId===id;})){alert("Gia nel carrello!");return;}
  S.cart.push(c);render();
}
function remCart(id){
  S.cart=S.cart.filter(function(c){return c.cardId!==id;});
  if(el("dcart").classList.contains("open"))openDrw("cart");else render();
}
function checkout(){
  var tot=S.cart.reduce(function(s,c){return s+c.price;},0);
  if(S.coins<tot){alert("Coins insufficienti! Hai "+px(S.coins)+" C ma servono "+px(tot)+" C");return;}
  if(confirm("Acquistare "+S.cart.length+" carte per "+px(tot)+" C?")){
    S.coins-=tot;
    S.cart.forEach(function(c){if(!S.collection.some(function(x){return x.cardId===c.cardId;}))S.collection.push(c);});
    S.cart=[];closeDrw();render();alert("Acquisto completato!");
  }
}
function toggleW(id){
  var idx=S.watch.indexOf(id);
  if(idx>-1)S.watch.splice(idx,1);else S.watch.push(id);
  render();
}
function addLine(id){
  var c=S.collection.find(function(x){return x.cardId===id;});
  if(!c)return;
  if(Object.values(S.lineup).some(function(x){return x&&x.cardId===id;})){S.lineup[c.role]=null;}
  else{if(S.lineup[c.role]&&!confirm("Sostituire "+S.lineup[c.role].name+"?"))return;S.lineup[c.role]=c;}
  render();
}
function rmLine(role){S.lineup[role]=null;render();}
function toggleCL(compId,cardId){
  if(!S.compL[compId])S.compL[compId]={};
  var c=CARDS.find(function(x){return x.cardId===cardId;});
  if(!c)return;
  var ml=S.compL[compId];
  if(Object.values(ml).some(function(x){return x&&x.cardId===cardId;})){ml[c.role]=null;}
  else{ml[c.role]=c;}
  openComp(compId);
}
function SF(k,v){S.filt[k]=v;render();}
function filterF(q){var d=el("frnd");if(d)d.innerHTML=friendList(q);}

// ── RENDER ────────────────────────────────────────────────────────────────────
var NAVS=[{id:"home",l:"Home"},{id:"market",l:"Marketplace"},{id:"collection",l:"Collezione"},{id:"play",l:"Gioca"},{id:"info",l:"Come Funziona"},{id:"leaderboard",l:"Classifiche BeatDraft"}];
var PFNS={home:pgHome,market:pgMarket,collection:pgCollection,play:pgPlay,info:pgInfo,competitions:pgCompetitions,competition:pgCompetition,charts:pgCharts,scoring:pgScoring,leaderboard:pgLB,watchlist:pgWatchlist,profile:pgProfile};

  var ln=Object.values(S.lineup).filter(Boolean).length;
  var navHTML=NAVS.map(function(n){
    var wBadge=n.id==="watchlist"&&wcv>0
      ?"<span style=\"background:rgba(245,166,35,.18);color:var(--g);font-size:7px;padding:1px 4px;border-radius:8px;margin-left:2px\">"+wcv+"</span>"
      :"";
    return "<button class=\"nb"+(S.page===n.id?" act":"")+"\" onclick=\"go('"+n.id+"')\">"+n.l+wBadge+"</button>";
  }).join("");
  var cartBadge=ccv>0?"<span style=\"position:absolute;top:-4px;right:-4px;background:var(--c);color:#000;font-size:7px;font-family:'Bebas Neue',sans-serif;padding:1px 3px;border-radius:8px;min-width:13px;text-align:center\">"+ccv+"</span>":"";
  var notifBadge=ucv>0?"<span style=\"position:absolute;top:-4px;right:-4px;background:#EF4444;color:#fff;font-size:7px;font-family:'Bebas Neue',sans-serif;padding:1px 3px;border-radius:8px;min-width:13px;text-align:center\">"+ucv+"</span>":"";
  var watchBadge=wcv>0?"<span style=\"position:absolute;top:-4px;right:-4px;background:var(--g);color:#000;font-size:7px;font-family:'Bebas Neue',sans-serif;padding:1px 3px;border-radius:8px;min-width:13px;text-align:center\">"+wcv+"</span>":"";
  var fn=PFNS[S.page]||pgHome;
  el("app").innerHTML=
    "<header style=\"background:rgba(6,11,20,.94);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:200;backdrop-filter:blur(18px)\">"
    +"<div style=\"max-width:1440px;margin:0 auto;padding:0 18px;display:flex;align-items:center;justify-content:space-between;height:52px\">"
    +"<div style=\"display:flex;align-items:center;gap:7px;cursor:pointer\" onclick=\"go('home')\">"
    +"<span style=\"font-size:1.15rem\">🎵</span>"
    +"<span style=\"font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.1em;color:var(--c)\">BEATDRAFT</span>"
    +"</div>"
    +"<div style=\"display:flex;align-items:center;gap:5px\">"
    +"<div style=\"background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.2);padding:4px 11px;border-radius:20px;font-family:'JetBrains Mono',monospace;font-size:.76rem;color:var(--g)\">"+px(S.coins)+" C</div>"
    +"<div onclick=\"go('collection')\" style=\"background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.18);padding:4px 10px;border-radius:20px;font-size:.72rem;color:#34D399;cursor:pointer\">⚡ "+ln+"/5</div>"
    +"<button onclick=\"go('watchlist')\" style=\"position:relative;background:rgba(255,255,255,.06);border:1px solid var(--b);border-radius:8px;padding:6px 7px;cursor:pointer;color:"+(wcv>0?"var(--g)":"var(--m)")+"\">🔖"+watchBadge+"</button>"
    +"<button onclick=\"openDrw('cart')\" style=\"position:relative;background:rgba(255,255,255,.06);border:1px solid var(--b);border-radius:8px;padding:6px 7px;cursor:pointer;color:"+(ccv>0?"var(--c)":"var(--m)")+"\">🛒"+cartBadge+"</button>"
    +"<button onclick=\"openDrw('notif')\" style=\"position:relative;background:rgba(255,255,255,.06);border:1px solid var(--b);border-radius:8px;padding:6px 7px;cursor:pointer;color:"+(ucv>0?"#F87171":"var(--m)")+"\">🔔"+notifBadge+"</button>"
    +"<button onclick=\"openDrw('prof')\" style=\"background:linear-gradient(135deg,rgba(124,58,237,.25),rgba(0,229,255,.12));border:1px solid rgba(0,229,255,.16);border-radius:8px;padding:5px 11px;cursor:pointer;color:var(--t);font-size:.76rem;font-family:'Bebas Neue',sans-serif;letter-spacing:.05em\">DemoUser ▾</button>"
    +"</div></div></header>"
    +"<nav style=\"background:rgba(13,22,37,.97);border-bottom:1px solid var(--b);position:sticky;top:52px;z-index:100;backdrop-filter:blur(12px);overflow-x:auto\">"
    +"<div style=\"max-width:1440px;margin:0 auto;padding:0 18px;display:flex\">"+navHTML+"</div></nav>"
    +"<main style=\"max-width:1440px;margin:0 auto;padding:22px 18px\">"+fn()+"</main>"
    +"<footer style=\"border-top:1px solid rgba(255,255,255,.04);padding:14px;text-align:center;font-size:.66rem;color:var(--m);margin-top:28px\">BEATDRAFT &copy; 2026 &middot; Fantasy Music Platform</footer>";
}

function go(p){S.page=p;render();window.scrollTo(0,0);}
render();
</script>
